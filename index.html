const KEY='another_day_v1';const seed={profile:null,day:1,affinity:0,choices:[],messages:[{from:'jk',text:'안녕 ㅋㅋ\n听说你也玩这个游戏？',day:1}],group:[{from:'Jimin',text:'这个群终于建好了ㅋㅋ',day:1},{from:'JK',text:'晚上有人玩吗？',day:1}],posts:[],notes:'',history:[],lastOpen:Date.now()};let state=JSON.parse(localStorage.getItem(KEY)||'null')||structuredClone(seed),page='lock',chatName='jk';const $=s=>document.querySelector(s),save=()=>{state.lastOpen=Date.now();localStorage.setItem(KEY,JSON.stringify(state))},esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const header=(name)=>`<div class="header"><button class="back" onclick="goHome()">‹</button><h2>${name}</h2><span class="mini">同人虚构</span></div>`;const btn=(label,fn,cl='')=>`<button class="button ${cl}" onclick="${fn}">${label}</button>`;const card=t=>`<div class="card">${t}</div>`;const appIcons=[['KakaoTalk','TALK','#f5dc47','kakao'],['Instagram','◎','#c6509e','instagram'],['Threads','@','#191919','threads'],['X','𝕏','#151515','x'],['Weverse','W','#25b8b2','weverse'],['相册','▧','#f8f8fb','photos'],['日历','17','#f4f2f7','calendar'],['备忘录','▤','#efc968','notes'],['资料库','▶','#ed575a','media'],['设置','⚙','#8a91a5','settings']];function render(){let el=$('#screen');el.className='screen';if(!state.profile){page='onboard';el.innerHTML=`<div class="intro"><h1>Another Day ✦</h1><p>欢迎来到你的虚构手机世界。这里的私人聊天与关系均为原创同人故事，不代表真实艺人。</p><label>你的昵称</label><input id="nick" class="field" maxlength="24" placeholder="你希望被怎样称呼？"><label>生日（选填）</label><input id="birthday" class="field" type="date"><label>社交账号昵称（选填）</label><input id="handle" class="field" placeholder="@yourname"><label>头像（选填，本机保存）</label><input id="avatarFile" type="file" accept="image/*"><p class="mini">演示版数据仅存于当前浏览器。请勿上传敏感照片。</p>${btn('创建我的手机','onboard()')}</div>`;return}if(page==='lock'){el.innerHTML=`<div class="lock"><div class="date">${new Date().toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'})}</div><div class="time">${new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}</div><div class="notice">📱 Another Day<br><span class="mini">${esc(state.profile.nick)}，你有新的故事等待探索 · 第 ${state.day} 天</span></div><div style="margin-top:35px">${btn('向上滑动解锁','goHome()')}</div></div>`;return}if(page==='home'){el.innerHTML=`<div class="home"><div class="top"><div class="muted">${new Date().toLocaleDateString('zh-CN',{month:'long',day:'numeric'})} · 故事第 ${state.day} 天</div><h1>你好，${esc(state.profile.nick)} ☀</h1><div class="muted">你的手机 · 平行世界同人故事</div></div><div class="icons">${appIcons.map(a=>`<button class="appicon" onclick="openApp('${a[3]}')"><div class="tile" style="background:${a[2]};color:${a[3]==='photos'?'#555':'white'}">${a[1]}</div>${a[0]}</button>`).join('')}</div><div class="dock">${[['☎','#35c46b','contacts'],['◉','#4092ed','instagram'],['✉','#39bf70','kakao'],['♫','#f06994','media']].map(a=>`<button class="appicon" onclick="openApp('${a[2]}')"><div class="tile" style="background:${a[1]}">${a[0]}</div></button>`).join('')}</div></div>`;return}let content='';switch(page){case'kakao':content=header('KakaoTalk')+`<div class="listrow" onclick="openChat('jk')"><div class="avatar">🐰</div><div class="grow"><b>JK · 虚构角色</b><small>${esc(state.messages.at(-1)?.text||'')}</small></div><span class="mini">${state.messages.length}</span></div><div class="listrow" onclick="openChat('group')"><div class="avatar">🎮</div><div class="grow"><b>游戏小分队 · 虚构群聊</b><small>${esc(state.group.at(-1)?.text||'')}</small></div></div>`+card(`<b>剧情进度</b><p class="muted">第 ${state.day} 天 · 互动值 ${state.affinity}</p>${btn('推进故事一天','advanceDay()','outline')}`);break;case'chat':let group=chatName==='group',msgs=group?state.group:state.messages;content=header(group?'游戏小分队':'JK · 虚构角色')+`<div class="note">非官方同人模拟对话 · 不是本人真实消息</div><div class="chat">${msgs.map(m=>`<div class="bubble ${m.from==='me'?'mine':''}">${group&&m.from!=='me'?`<b>${esc(m.from)}</b><br>`:''}${esc(m.text)}</div>`).join('')}</div>`+(group?'':`<div style="padding:0 16px">${state.day===1&&!state.choices.includes('first')?`${btn('我也玩！今晚一起？',"choose('game')",'outline choice')}${btn('我刚开始玩，有点菜ㅋㅋ',"choose('beginner')",'outline choice')}`:''}</div>`)+`<div class="composer"><input class="field" id="chatInput" placeholder="发送虚构消息…" onkeydown="if(event.key==='Enter')sendChat()"><button class="button" onclick="sendChat()">发送</button></div><div class="note">AI 尚未连接。自由输入会被保存，但不会伪装成 AI 自动回复。</div>`;break;case'instagram':content=header('Instagram · 模拟')+feed('Instagram');break;case'threads':content=header('Threads · 模拟')+feed('Threads');break;case'x':content=header('X · 模拟')+feed('X');break;case'weverse':content=header('Weverse · 资料体验')+card(`<span class="tag">公开资料入口</span><h3>Weverse 内容资料库</h3><p>这里将按年份整理真实公开直播、官方动态和采访。正式上线前需核验来源与嵌入许可。</p><p class="mini">本演示没有伪造艺人真实发言或实际 Weverse 数据。</p>`)+card(`<h3>虚构故事提示</h3><p>你可以在这里发现与游戏、音乐相关的剧情线索，再回到 KakaoTalk 继续故事。</p>${btn('返回聊天',"openApp('kakao')")}`);break;case'photos':content=header('相册')+card(`<h3>我的相册</h3><div class="photo">📷<br>你的故事照片</div><p class="mini">支持图片本地导入；真实艺人照片须取得适当使用许可或使用合法嵌入。</p><input type="file" accept="image/*" onchange="loadPhoto(event)"><div id="userPhoto"></div>`);break;case'calendar':content=header('日历')+card(`<h3>故事日历 · 第 ${state.day} 天</h3><p>📌 当前章节：${state.day<=7?'第一周 · 初识':state.day<=21?'第一季 · 同局':'开放体验'}</p><p class="muted">已完成选择：${state.choices.length}</p>${btn('进入下一天','advanceDay()')}`)+card('<h3>已发生的事件</h3>'+ (state.history.map(h=>`<p class="feed">${esc(h)}</p>`).join('')||'<p class="muted">尚无记录</p>'));break;case'notes':content=header('备忘录')+card(`<h3>我的备忘录</h3><textarea id="notesText" class="field" rows="10" placeholder="记录你的故事……">${esc(state.notes)}</textarea>${btn('保存备忘录','saveNotes()')}`);break;case'media':content=header('多媒体资料库')+card(`<h3>照片 · 音频 · 视频</h3><p>原生播放器组件已预留。授权媒体可放在 <code>assets/</code> 中，并在 <code>media.json</code> 登记来源、权利与路径。</p><div class="photo">照片预览区域</div><div class="media"><span>🎧</span><audio controls preload="none"></audio></div><video controls playsinline poster="" style="background:#25232d;aspect-ratio:16/9"></video><p class="mini">当前没有附带田柾国的照片、原声音频或视频文件。</p>`);break;case'settings':content=header('设置')+card(`<h3>玩家资料</h3><p>昵称：${esc(state.profile.nick)}</p><p>生日：${esc(state.profile.birthday||'未设置')}</p><p>账号：${esc(state.profile.handle||'未设置')}</p><p>当前故事第 ${state.day} 天</p>`)+card(`<h3>AI 接口</h3><p class="muted">预留适配器：<code>window.StoryAI.reply(context)</code>，默认返回未配置状态。未来应通过服务端代理调用模型，不能把 API Key 写在前端。</p>`)+card(`<h3>存档</h3>${btn('导出 JSON 存档','exportSave()','outline')} ${btn('清除本机存档','resetSave()','outline')}`);break;case'contacts':content=header('通讯录')+card('<h3>联系人</h3><p>JK（虚构角色）</p><p>游戏小分队（虚构群聊）</p>');break}el.innerHTML=content;el.scrollTop=0}
function feed(app){let examples=app==='Instagram'?[['虚构生活动态','今天的天空很好看。','照片位 · 可由授权素材替换'],['故事线索','朋友分享了新游戏的截图。','剧情模拟帖子']]:app==='Threads'?[['虚构讨论','有没有人最近也在玩合作游戏？','虚构互动'],['虚构日常','今天适合听歌散步。','虚构互动']]:[['资料索引','BTS 早期公开动态可以按年份整理，需使用经核实的原始来源。','资料占位'],['虚构粉丝讨论','今天大家都在讨论游戏直播。','虚构帖子']];return card(`<div class="tag">模拟信息流 · 非真实账号</div>${examples.map((p,i)=>`<div class="feed"><b>${p[0]}</b><p>${p[1]}</p><div class="photo">${p[2]}</div><p><button class="button outline" onclick="likePost('${app}',${i})">♡ 点赞</button> <span class="mini" id="like-${app}-${i}">${state.posts.includes(app+i)?'已点赞':''}</span></p></div>`).join('')}`)}function likePost(a,i){let k=a+i;if(!state.posts.includes(k))state.posts.push(k);save();render()};function goHome(){page='home';render()}function openApp(p){page=p;render()}function openChat(name){chatName=name;page='chat';render()}function onboard(){let nick=$('#nick').value.trim();if(!nick){alert('请先填写昵称');return}state.profile={nick,birthday:$('#birthday').value,handle:$('#handle').value.trim()};save();page='home';render()}function choose(type){state.choices.push('first');state.messages.push({from:'me',text:type==='game'?'我也玩！今晚一起？':'我刚开始玩，有点菜ㅋㅋ',day:state.day});state.messages.push({from:'jk',text:type==='game'?'ㅋㅋ 好啊，有空的话一起玩。':'没关系ㅋㅋ 慢慢来就好。',day:state.day});state.affinity+=type==='game'?2:1;state.history.push(`第${state.day}天：完成初次游戏话题`);save();render()}function sendChat(){let input=$('#chatInput'),v=input.value.trim();if(!v)return;(chatName==='group'?state.group:state.messages).push({from:'me',text:v,day:state.day});state.history.push(`第${state.day}天：发送了一条${chatName==='group'?'群聊':'私聊'}消息`);save();render()}function advanceDay(){state.day++;let events={2:'你发现群聊里有人讨论最近的游戏。',3:'JK：今天听了一首不错的歌ㅋㅋ',4:'Jimin：下次要不要大家一起玩？',5:'JK：这两天有点忙，之后再聊！',6:'JK：你之前说的那个游戏，我去看了一下。',7:'JK：这周过得怎么样？'};if(events[state.day]){state.messages.push({from:'jk',text:events[state.day],day:state.day});state.history.push(`第${state.day}天：${events[state.day]}`)}else state.history.push(`第${state.day}天：进入新的故事日`);save();render()}function saveNotes(){state.notes=$('#notesText').value;save();alert('已保存在当前浏览器')}function loadPhoto(e){let f=e.target.files?.[0];if(!f)return;if(f.size>2e6){alert('演示版请选择小于2MB的图片');return}let r=new FileReader();r.onload=()=>{$('#userPhoto').innerHTML=`<img alt="用户导入的照片" style="max-width:100%;border-radius:12px;margin-top:12px" src="${r.result}">`};r.readAsDataURL(f)}function exportSave(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='another-day-save.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function resetSave(){if(confirm('确定删除本机全部剧情存档吗？')){localStorage.removeItem(KEY);state=structuredClone(seed);page='onboard';render()}}window.StoryAI={async reply(context){return {configured:false,text:null,error:'AI 服务尚未配置',contextReceived:!!context}}};setInterval(()=>{$('#clock').textContent=new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})},30000);render();

// Native-feeling interactions: swipe up to unlock, swipe down for notification shade.
let touchY=0,touchX=0;
const phone=document.querySelector('.phone');
phone.addEventListener('touchstart',e=>{touchY=e.touches[0].clientY;touchX=e.touches[0].clientX},{passive:true});
phone.addEventListener('touchend',e=>{const dy=e.changedTouches[0].clientY-touchY;const dx=e.changedTouches[0].clientX-touchX;if(Math.abs(dx)>Math.abs(dy))return;if(page==='lock'&&dy< -65)goHome();else if(page==='home'&&dy>100&&touchY<180)showNotifications()},{passive:true});
function showNotifications(){const s=document.getElementById('screen');s.innerHTML=`<div class="lock" style="text-align:left;padding:68px 18px 20px;min-height:100%"><div style="text-align:center;color:white;font-size:50px;font-weight:250">${new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}</div><h2 style="color:white;margin-top:50px">通知中心</h2><div class="notice" onclick="openApp('kakao')">💬 KakaoTalk <span class="tag">虚构剧情</span><p>${esc(state.messages.at(-1)?.text||'暂无新消息')}</p></div><div class="notice" onclick="openApp('calendar')">📅 故事日历<p>第 ${state.day} 天 · 查看今天的故事</p></div><p style="color:white;text-align:center;margin-top:30px" onclick="goHome()">向上返回桌面 ↑</p></div>`}
</script></body></html>
